# Workboard on the shared VPS. Run from /opt/workboard/deploy with a filled-in .env and app.env (never committed).
# The app joins the shared `edge` network so the workspec Caddy can proxy larksuite.prima49.com to workboard-app:80.
# The database has no published port; it is reachable only from the app on the internal network.
name: workboard
services:
  db:
    image: mariadb:10.11
    container_name: workboard-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: workboard
      MARIADB_USER: workboard_app
      MARIADB_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in deploy/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - db_data:/var/lib/mysql
      # Runs only when the data volume is empty (first start). Later migrations are applied by hand.
      - ../api/migrations/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
      - ../api/migrations/002_meetings.sql:/docker-entrypoint-initdb.d/002_meetings.sql:ro
      - ../api/migrations/003_permanent_links.sql:/docker-entrypoint-initdb.d/003_permanent_links.sql:ro
      - ../api/migrations/004_optional_go_live.sql:/docker-entrypoint-initdb.d/004_optional_go_live.sql:ro
      - ./initdb/900_app_grants.sql:/docker-entrypoint-initdb.d/900_app_grants.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: workboard-app:latest
    container_name: workboard-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app.env:/var/www/html/.env:ro
    # Loopback only: for checks over an SSH tunnel. Public traffic arrives through Caddy on `edge`.
    ports:
      - "127.0.0.1:8095:80"
    networks: [internal, edge]

volumes:
  db_data: {}

networks:
  internal: {}
  edge:
    external: true
